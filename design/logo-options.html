<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aethis logo options</title>
<style>
  body { background: #f7f5f0; color: #16161a; font-family: "Times New Roman", serif; margin: 48px; }
  .row { display: flex; gap: 64px; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  svg { width: 160px; height: 160px; }
  figcaption { margin-top: 16px; font-size: 18px; }
  small { display: block; color: #6b6a66; max-width: 220px; margin-top: 6px; }
</style>
</head>
<body>
<div class="row">
  <!-- A: Zenith. A sky dome; of three paths from one origin, the chosen one reaches the light at the top. -->
  <figure>
    <svg viewBox="0 0 32 32" fill="none" stroke-linecap="round">
      <path d="M5 21 A11 11 0 0 1 27 21" stroke="#16161a" stroke-width="1.4"/>
      <line x1="16" y1="27" x2="9.5" y2="17.5" stroke="#16161a" stroke-width="1.4" opacity=".35"/>
      <line x1="16" y1="27" x2="22.5" y2="17.5" stroke="#16161a" stroke-width="1.4" opacity=".35"/>
      <line x1="16" y1="27" x2="16" y2="12.5" stroke="#2f4a7a" stroke-width="1.6"/>
      <circle cx="16" cy="10" r="2.4" fill="#2f4a7a"/>
      <circle cx="16" cy="27" r="1.4" fill="#16161a"/>
    </svg>
    <figcaption>A. Zenith</figcaption>
    <small>Sky dome, three paths from one point, the chosen one reaches the light.</small>
  </figure>

  <!-- B: Quintessence. Four element points on a ring, the fifth at the center. -->
  <figure>
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="11" stroke="#16161a" stroke-width="1.4"/>
      <circle cx="16" cy="5" r="1.6" fill="#16161a"/>
      <circle cx="27" cy="16" r="1.6" fill="#16161a"/>
      <circle cx="16" cy="27" r="1.6" fill="#16161a"/>
      <circle cx="5" cy="16" r="1.6" fill="#16161a"/>
      <circle cx="16" cy="16" r="3" fill="#2f4a7a"/>
    </svg>
    <figcaption>B. Quintessence</figcaption>
    <small>Four classical elements on a ring, aether as the fifth at the center.</small>
  </figure>

  <!-- C: Horizon. Stacked arcs of sky with a single point of light rising. -->
  <figure>
    <svg viewBox="0 0 32 32" fill="none" stroke-linecap="round">
      <path d="M4 26 A12 12 0 0 1 28 26" stroke="#16161a" stroke-width="1.4"/>
      <path d="M9 26 A7 7 0 0 1 23 26" stroke="#16161a" stroke-width="1.4" opacity=".45"/>
      <line x1="3" y1="26" x2="29" y2="26" stroke="#16161a" stroke-width="1.4"/>
      <circle cx="16" cy="8" r="2.4" fill="#2f4a7a"/>
    </svg>
    <figcaption>C. Horizon</figcaption>
    <small>Layers of sky over a horizon, with one point of light above.</small>
  </figure>
</div>
</body>
</html>
